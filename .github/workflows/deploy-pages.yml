name: Deploy Rankings to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'data/rankings/prospect_scores.csv'
      - 'data/rankings/aaa_2026.csv'
      - 'output/build_rankings_html.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Build HTML
        run: |
          mkdir -p _site
          RANKINGS_OUT_DIR=_site python output/build_rankings_html.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
