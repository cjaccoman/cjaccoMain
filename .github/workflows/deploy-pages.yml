name: Deploy Rankings to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'data/rankings/prospect_scores.csv'
      - 'data/rankings/aaa_2026.csv'
      - 'output/build_rankings_html.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Build HTML
        run: |
          mkdir -p _site
          python - <<'EOF'
          import sys, os
          # Redirect output path to _site/index.html
          src = open('output/build_rankings_html.py', encoding='utf-8').read()
          src = src.replace(
              "SCRATCHPAD = Path(r\"C:\\Users\\cjacc\\AppData\\Local\\Temp\\claude\\C--Users-cjacc-PycharmProjects-prospectsMain\\5dc88b54-dc8f-45dc-934f-30c09d0bfd05\\scratchpad\")",
              "SCRATCHPAD = Path('_site')"
          ).replace(
              "OUT_PATH   = SCRATCHPAD / \"prospect_rankings.html\"",
              "OUT_PATH   = SCRATCHPAD / \"index.html\""
          )
          exec(compile(src, 'build_rankings_html.py', 'exec'))
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
